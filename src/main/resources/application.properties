spring.application.name=api
server.port=${PORT:8081}

api.security.token.secret=${JWT_SECRET:SenhaSuperSecretaComMaisDe32CaracteresParaOJWT123!}

spring.config.import=optional:file:.env[.properties]

# Configurações do Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:vaultpay_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do JPA e Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Como vocês estão usando Flyway agora, mas podem ter usado o Hibernate para criar o banco no início, 'update' ajuda no dev local
spring.jpa.hibernate.ddl-auto=update

# Configurações do Flyway
spring.flyway.enabled=true
# Essa configuração é crucial: se o banco já existir (criado pelo Hibernate), o Flyway cria uma "linha de base" e não quebra
spring.flyway.baseline-on-migrate=true

# Ativação das Virtual Threads (Requer Java 21+ e Spring Boot 3.2+)
spring.threads.virtual.enabled=true

# Configurações do Google Gemini AI
langchain4j.google-ai.gemini.chat-model.api-key=${AI_API_KEY:mock-api-key}
langchain4j.google-ai.gemini.chat-model.model-name=gemini-3.6-flash
