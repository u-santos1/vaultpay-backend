spring.application.name=api
server.port=${PORT}

api.security.token.secret=${JWT_SECRET}

spring.config.import=optional:file:.env[.properties]

# Configurações do Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do JPA e Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# O Flyway gerencia o DDL através das migrations; validate garante integridade sem alterações automáticas do Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Configurações do Flyway
spring.flyway.enabled=true
# Essa configuração é crucial: se o banco já existir (criado pelo Hibernate), o Flyway cria uma "linha de base" e não quebra
spring.flyway.baseline-on-migrate=true

# Ativação das Virtual Threads (Requer Java 21+ e Spring Boot 3.2+)
spring.threads.virtual.enabled=true

# Configurações do Google Gemini AI
langchain4j.google-ai.gemini.chat-model.api-key=${AI_API_KEY:mock-api-key}
langchain4j.google-ai.gemini.chat-model.model-name=gemini-3.6-flash

# Proxy Reverso / Forwarded Headers (Segurança contra IP Spoofing no Rate Limiting)
server.forward-headers-strategy=framework

# Configurações do Spring Boot Actuator & Healthcheck
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


