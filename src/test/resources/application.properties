
# ========================================================
# CONFIGURAÇÕES DO AMBIENTE DE TESTES / CI (GITHUB ACTIONS)
# ========================================================

# 1. Banco H2 em Memória com Emulação Oficial do PostgreSQL
spring.datasource.url=jdbc:h2:mem:vaultpay_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. JPA e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# 3. Flyway ativo no H2 para validar as migrations no CI
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# 4. Segurança e JWT Mock para Testes
api.security.token.secret=chave_falsa_apenas_para_passar_nos_testes_locais_123456
server.port=${PORT:8080}

# 5. Configurações Mock de IA para não quebrar testes unitários
langchain4j.google-ai.gemini.chat-model.api-key=mock-api-key-ci
langchain4j.google-ai.gemini.chat-model.model-name=gemini-3.6-flash


