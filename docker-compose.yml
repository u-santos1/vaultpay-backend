version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vaultpay-db
    environment:
      POSTGRES_DB: vaultpay_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
    ports:
      - "5433:5432"
    volumes:
      - vaultpay_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: vaultpay-api
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      # Sobrescreve a URL do banco para apontar para o container 'db' em vez de localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vaultpay_db
      DB_NAME: vaultpay_db
      DB_USER: root
      DB_PASSWORD: 123
      JWT_SECRET: SenhaSuperSecretaComMaisDe32CaracteresParaOJWT123!

volumes:
  vaultpay_data:
