version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: vaultpay-db
    environment:
      POSTGRES_DB: vaultpay_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d vaultpay_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - vaultpay_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: vaultpay-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Sobrescreve a URL do banco para apontar para o container 'db' em vez de localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vaultpay_db
      PORT: 8080
      DB_NAME: vaultpay_db
      DB_USER: root
      DB_PASSWORD: 123
      JWT_SECRET: SenhaSuperSecretaComMaisDe32CaracteresParaOJWT123!
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  vaultpay_data:
